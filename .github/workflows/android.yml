name: Android APK

on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      stable_signing: ${{ steps.preview_signing.outputs.configured }}
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      VITE_TURN_CREDENTIALS_URL: ${{ vars.VITE_TURN_CREDENTIALS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck && pnpm lint && pnpm test
      - name: Restore optional preview signing key
        id: preview_signing
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            printf 'configured=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'configured=false\n' >> "$GITHUB_OUTPUT"
            echo '::warning::Stable preview signing key is not configured. APK artifacts use a temporary debug key; automatic release publication is disabled.'
          fi
      - run: pnpm android:build
      - uses: actions/upload-artifact@v4
        with:
          name: Money-Tour-Android-preview
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  native-smoke:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_QA_ALLOW_RESET: '1'
      ANDROID_QA_APK: artifacts/android/Money-Tour-Android-0.1.0-debug.apk
      ANDROID_DEVICE_QA_OUT: artifacts/android-qa/device
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: Money-Tour-Android-preview
          path: artifacts/android
      - name: Prepare native acceptance evidence
        shell: bash
        run: |
          mkdir -p artifacts/android-qa/device
          printf 'Emulator acceptance has not started. If boot fails, consult the Android emulator step log.\n' > artifacts/android-qa/device/device-run.log
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Test the actual APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-linux-hw-accel: false
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -skin 480x960
          script: bash scripts/qa-android-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-native-acceptance
          path: artifacts/android-qa/device/
          if-no-files-found: warn
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/android-v') && needs.build.outputs.stable_signing == 'true' && needs.native-smoke.result == 'success'
    needs: [build, native-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Money-Tour-Android-preview
          path: android-preview
      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" android-preview/* \
            --verify-tag --prerelease \
            --title "Money Tour Android · $GITHUB_REF_NAME" \
            --notes 'Version Android de test. Téléchargez le fichier .apk sur votre téléphone et autorisez son installation. Le jeu local fonctionne hors connexion. Les salons en ligne nécessitent Internet et peuvent nécessiter un relais TURN selon le réseau. Consultez le README et le rapport de recette du dépôt pour les fonctions vérifiées et les limites.'
